# Read the Docs configuration file
# See https://docs.readthedocs.com/platform/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  commands:
    # Install Sphinx and the theme (pinned in docs/requirements.txt).
    - python -m pip install --upgrade pip
    - python -m pip install -r docs/requirements.txt
    # docs/source is gitignored, so the API reference pages are generated here,
    # exactly as the GitHub Pages workflow (docs.yml) and docs/Makefile do.
    - sphinx-apidoc -f -o docs/source scaleway-core
    - sphinx-apidoc -f -o docs/source scaleway
    - sphinx-apidoc -f -o docs/source scaleway-async
    - mkdir -p $READTHEDOCS_OUTPUT/html
    - sphinx-build -T -b html -d docs/_build/doctrees docs $READTHEDOCS_OUTPUT/html/
